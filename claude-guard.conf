# Claude-Guard 0.0.0.2 | Shadowrocket 2.2.92 compatibility target | 2026-10-11
# 国内/局域网及苹果、微软服务直连；GitHub/Copilot 优先代理；其余海外 TCP 代理、UDP 拒绝。
# 节点、密码、订阅、代理链均留在手机本地。详见 README.md。

[General]
# 不绕过公网服务；局域网也经过规则分类，减少 TUN 之外的例外。
skip-proxy = localhost,*.local
tun-excluded-routes =
# 海外解析及备用解析均通过首页当前节点（应选择台湾静态出口）。
dns-server = https://1.1.1.1/dns-query#proxy,https://1.0.0.1/dns-query#proxy
fallback-dns-server = https://1.0.0.1/dns-query#proxy
# 国内及苹果/微软域名命中直连规则后使用直连 DNS；局域网允许系统解析。
direct-dns-server = 119.29.29.29,223.5.5.5,system
dns-direct-system = false
dns-direct-fallback-proxy = true
# 仅解析代理服务器自身域名，避免 DNS 与代理启动互相依赖。
proxy-dns-server = https://223.6.6.6/dns-query,https://120.53.53.53/dns-query
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true
icmp-auto-reply = true
hijack-dns = 8.8.8.8:53,8.8.4.4:53
udp-policy-not-supported-behaviour = REJECT
close-if-proxy-chain-missing = true
block-quic = all-proxy

[Proxy]
# 故意留空：不要把节点凭据写入公开仓库。

[Proxy Group]
海外TCP = select,PROXY,policy-select-name=PROXY
国内及局域网 = select,DIRECT,policy-select-name=DIRECT
苹果服务 = select,DIRECT,policy-select-name=DIRECT
微软服务 = select,DIRECT,policy-select-name=DIRECT
海外UDP = select,REJECT,policy-select-name=REJECT

[Rule]
# 使用电脑当前 geosite/geoip 导出的快照；苹果、微软保留显式直连例外。
RULE-SET,https://raw.githubusercontent.com/gozelus/shadowrocket-rules/main/rules/private-domains.list,国内及局域网
IP-CIDR,127.0.0.0/8,国内及局域网,no-resolve
IP-CIDR,10.0.0.0/8,国内及局域网,no-resolve
IP-CIDR,172.16.0.0/12,国内及局域网,no-resolve
IP-CIDR,192.168.0.0/16,国内及局域网,no-resolve
IP-CIDR6,::1/128,国内及局域网,no-resolve
IP-CIDR6,fe80::/10,国内及局域网,no-resolve
# GitHub/Copilot 优先于微软直连；仍阻断这些服务的 UDP，避免因节点不支持而改变出口。
AND,((PROTOCOL,UDP),(RULE-SET,https://raw.githubusercontent.com/gozelus/shadowrocket-rules/main/rules/github-copilot-proxy.list)),海外UDP
RULE-SET,https://raw.githubusercontent.com/gozelus/shadowrocket-rules/main/rules/github-copilot-proxy.list,海外TCP
RULE-SET,https://raw.githubusercontent.com/gozelus/shadowrocket-rules/main/rules/apple-domains.list,苹果服务
RULE-SET,https://raw.githubusercontent.com/gozelus/shadowrocket-rules/main/rules/microsoft-domains.list,微软服务
RULE-SET,https://raw.githubusercontent.com/gozelus/shadowrocket-rules/main/rules/cn-domains.list,国内及局域网
RULE-SET,https://raw.githubusercontent.com/gozelus/shadowrocket-rules/main/rules/cn-ip.list,国内及局域网
# PROTOCOL 只能作为逻辑子规则，分别覆盖 IPv4 与 IPv6 的剩余 UDP。
AND,((PROTOCOL,UDP),(IP-CIDR,0.0.0.0/0)),海外UDP
AND,((PROTOCOL,UDP),(IP-CIDR6,::/0)),海外UDP
FINAL,海外TCP

[Host]
localhost = 127.0.0.1

[URL Rewrite]

[MITM]
enable = false
